<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f6b55">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Prova Online EMFAL</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Archivo:wght@600;800&display=swap">
<style>
:root{
  --bg:#f6f8f7; --surface:#ffffff; --fg:#17231f; --muted:#5b6b65; --line:#d6dfdb;
  --accent:#0f6b55; --accent-soft:#e1f0eb; --pen:#1d4ed8; --pen-soft:#e3eafc;
  --warn:#b45309; --warn-soft:#fdf1e2; --bad:#b42318; --bad-soft:#fde8e6;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1714; --surface:#16211d; --fg:#e6eee9; --muted:#9aaba4; --line:#2a3833;
  --accent:#4cc3a0; --accent-soft:#183a30; --pen:#7aa2ff; --pen-soft:#1c2950;
  --warn:#f0a44b; --warn-soft:#3a2a14; --bad:#ff8a7e; --bad-soft:#3d1c19; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.5}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
header.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:10px}
.brand{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:.01em}
.brand small{display:block;font-family:var(--body);font-weight:400;font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
h1{font-size:28px;font-weight:800} h2{font-size:20px;font-weight:600}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.stack{display:flex;flex-direction:column;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted);font-weight:700}
input[type=text],input[type=number],input[type=password],textarea,select{font:400 16px var(--body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
textarea{min-height:70px;resize:vertical}
input:focus-visible,textarea:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
.check{flex-direction:row;align-items:center;gap:8px;color:var(--fg);font-weight:400}
.btn{font:700 16px var(--body);border-radius:10px;padding:12px 18px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.ghost{background:transparent}
.btn.small{padding:7px 12px;font-size:14px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.linkbtn{background:none;border:0;color:var(--accent);font:700 15px var(--body);cursor:pointer;padding:6px 0;text-decoration:underline}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}
.hint{font-size:14px;color:var(--muted)}
.erro{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:10px 14px;font-size:15px}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.pen{background:var(--pen-soft);color:var(--pen)}
.pill.mute{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.code{font-family:var(--display);font-weight:800;letter-spacing:.18em;font-variant-numeric:tabular-nums}

/* entrada do aluno */
.codein{font-family:var(--display)!important;font-weight:800!important;font-size:34px!important;letter-spacing:.3em;text-align:center;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 16px;font:700 15px var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.name{text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:12px 14px;font:400 17px var(--body);cursor:pointer;min-height:52px}
.name.feito{opacity:.5}

/* editor */
.q-edit{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:10px}
.q-edit:first-child{border-top:0;padding-top:0}
.alt-edit{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center}
.key{position:relative;display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);font-weight:700;cursor:pointer;color:var(--muted);background:var(--surface)}
.key input{position:absolute;opacity:0;pointer-events:none}
.key.on{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.pcard{display:flex;flex-direction:column;gap:10px}
.pcard + .pcard{border-top:1px solid var(--line);padding-top:16px}

/* tabelas */
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tot{display:flex;gap:10px;flex-wrap:wrap}

/* prova do aluno */
.timerbar{position:sticky;top:62px;z-index:4;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.clock{font-family:var(--display);font-weight:800;font-size:30px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.clock.warn{color:var(--warn)} .clock.bad{color:var(--bad)}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;flex-basis:100%}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.sheet{display:flex;flex-wrap:wrap;gap:8px}
.sheet button{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--surface);color:var(--fg);font:700 15px var(--body);cursor:pointer;font-variant-numeric:tabular-nums}
.sheet button.done{background:var(--pen);border-color:var(--pen);color:var(--surface)}
.sheet button.current{outline:3px solid var(--accent);outline-offset:2px}
.sheet button.missing{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.stem{font-size:20px;line-height:1.55;white-space:pre-wrap}
.alts{display:flex;flex-direction:column;gap:10px}
.alt{display:flex;gap:14px;align-items:flex-start;text-align:left;padding:14px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);font:400 18px var(--body);cursor:pointer;min-height:60px}
.alt .bub{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--muted);display:flex;align-items:center;justify-content:center;font-weight:700}
.alt[aria-checked="true"]{border-color:var(--pen);background:var(--pen-soft)}
.alt[aria-checked="true"] .bub{background:var(--pen);border-color:var(--pen);color:var(--surface)}
.notice{border-radius:10px;padding:12px 14px;font-size:16px}
.notice.warn{background:var(--warn-soft);color:var(--warn)}
.notice.bad{background:var(--bad-soft);color:var(--bad)}
.notice.ok{background:var(--accent-soft);color:var(--accent)}
.big{font-family:var(--display);font-weight:800;font-size:52px;font-variant-numeric:tabular-nums;line-height:1.1}
.modal{position:fixed;inset:0;background:rgb(0 0 0 / .45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal .panel{max-width:460px;width:100%}
#carga{position:fixed;inset:0;background:rgb(0 0 0 / .35);display:flex;align-items:center;justify-content:center;z-index:30}
#carga .panel{display:flex;gap:12px;align-items:center}
.spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:g 1s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;z-index:40}
.cartoes{display:none}
.ocs{display:flex;flex-direction:column;gap:6px;font-size:15px}
.ocs div{display:flex;gap:10px;flex-wrap:wrap}
@media print{
  @page{size:A4;margin:10mm}
  body{background:#fff;color:#000}
  header.top,.noprint,#modalRoot,#carga{display:none!important}
  .wrap{padding:0!important;max-width:none}
  .cartoes{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
  .cartao{border:1px dashed #777;padding:10px 12px;height:42mm;display:flex;flex-direction:column;justify-content:space-between;break-inside:avoid;page-break-inside:avoid;color:#000}
  .ct-top{font-size:9pt;letter-spacing:.08em;text-transform:uppercase;color:#444}
  .ct-nome{font-weight:700;font-size:11pt;line-height:1.2}
  .ct-turma{font-size:9pt;color:#333}
  .ct-pin{font-family:var(--display);font-weight:800;font-size:24pt;letter-spacing:.2em}
  .ct-obs{font-size:7.5pt;color:#444}
}
</style>
</head><body>
<header class="top"><div class="wrap">
  <div class="brand">Prova Online<small>EMFAL</small></div>
  <div class="row" id="topo"></div>
</div></header>
<main class="wrap" id="app"></main>
<div id="modalRoot"></div>
<div id="carga" hidden><div class="panel"><div class="spin"></div><span id="cargaMsg">Carregando...</span></div></div>

<script>
'use strict';
var API_URL = 'https://script.google.com/macros/s/AKfycbzCbPfrmF1AZhXP2xh0Se-mMQUJlWqbTkCZ8doxeNOsn5XHBE-2YMW-M6T4_R3BtBrF/exec';
var CORRETOR_URL = 'https://emfalped-source.github.io/corretor/';
var SEM_TOKEN = ['entrar', 'sair', 'alunoAbrir', 'alunoIniciar', 'alunoRetomar', 'alunoEntregar', 'alunoSaiu'];
var L = 'ABCDE';
var TIPOS = ['Prova parcial', 'Prova mensal', 'Prova trimestral', 'Simulado', 'Outra avaliação'];

// ---------- utilidades ----------
function $(s) { return document.querySelector(s); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function num(v) { return String(Math.round(Number(v) * 100) / 100).replace('.', ','); }
function guardar(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function pegar(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }
function pegarTexto(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
function carga(on, msg) { $('#carga').hidden = !on; if (msg) $('#cargaMsg').textContent = msg; }
function fmt(ms) { ms = Math.max(0, ms); var t = Math.ceil(ms / 1000), m = Math.floor(t / 60), s = t % 60; return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0'); }
function modal(t, msg, btns) {
  $('#modalRoot').innerHTML = '<div class="modal" role="dialog" aria-modal="true"><div class="panel stack"><h2>' + esc(t) + '</h2><p style="margin:0">' + esc(msg) + '</p><div class="row" style="justify-content:flex-end">' +
    btns.map(function (b, i) { return '<button class="btn ' + (b[2] || '') + '" data-mb="' + i + '">' + esc(b[0]) + '</button>'; }).join('') + '</div></div></div>';
  document.querySelectorAll('[data-mb]').forEach(function (b) { b.onclick = btns[+b.dataset.mb][1]; });
  var last = document.querySelector('[data-mb]:last-child'); if (last) last.focus();
}
function fecharModal() { $('#modalRoot').innerHTML = ''; }
// embaralhamento que se repete igual para o mesmo estudante (para retomar a prova)
function rng(seed) { var h = 2166136261; for (var i = 0; i < seed.length; i++) { h ^= seed.charCodeAt(i); h = Math.imul(h, 16777619); } return function () { h += 0x6D2B79F5; var t = h; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function embaralhar(a, r) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(r() * (i + 1)); var x = a[i]; a[i] = a[j]; a[j] = x; } return a; }

// ---------- servidor ----------
var SESS = pegar('corretor_sessao'); // mesma sessão do Corretor EMFAL
// identificação deste tablet (fica guardada no aparelho)
var APARELHO = pegarTexto('aparelho_id');
if (!APARELHO) { APARELHO = 'T' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); try { localStorage.setItem('aparelho_id', APARELHO); } catch (e) {} }
function api(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  if (SEM_TOKEN.indexOf(fn) < 0) args.unshift(SESS ? SESS.token : '');
  return fetch(API_URL, { method: 'POST', body: JSON.stringify({ fn: fn, args: args }), headers: { 'Content-Type': 'text/plain;charset=utf-8' }, credentials: 'omit', redirect: 'follow' })
    .catch(function () { throw new Error('Sem conexão com a internet. Confira o Wi-Fi e tente de novo.'); })
    .then(function (r) { if (!r.ok) throw new Error('O servidor não respondeu (erro ' + r.status + '). Tente de novo.'); return r.json(); })
    .then(function (j) {
      if (j && j.ok) return j.res;
      var m = String((j && j.erro) || 'Erro desconhecido.').replace(/^Error: /, '');
      if (/^SESSAO:/.test(m)) { SESS = null; guardar('corretor_sessao', null); m = m.replace(/^SESSAO: ?/, ''); }
      if (/^TROCAR:/.test(m)) { m = 'Antes de usar a Prova Online, troque sua senha provisória no Corretor EMFAL.'; }
      throw new Error(m);
    });
}
function chamar(msg) {
  var args = Array.prototype.slice.call(arguments, 1);
  carga(true, msg);
  return api.apply(null, args).then(function (r) { carga(false); return r; }, function (e) { carga(false); throw e; });
}

// ---------- estado ----------
var modo = location.hash === '#professor' ? 'prof' : 'aluno';
var A = { tela: 'codigo', erro: '', prova: null, turma: '', busca: '', s: null, envio: null };
var P = { tela: 'lista', erro: '', dados: null, ed: null, acomp: null, timer: null };
var tick = null;

function topo() {
  var t = $('#topo');
  if (modo === 'aluno') {
    var emProva = A.tela === 'prova';
    t.innerHTML = emProva ? '' : '<button class="btn small ghost" id="irProf">Área do professor</button>';
    var b = $('#irProf'); if (b) b.onclick = function () { modo = 'prof'; location.hash = 'professor'; render(); };
  } else {
    t.innerHTML = (SESS ? '<span class="hint">' + esc(SESS.eu.nome) + '</span><button class="btn small ghost" id="sairP">Sair</button>' : '') +
      '<button class="btn small" id="irAluno">Tela do aluno</button>';
    $('#irAluno').onclick = function () { modo = 'aluno'; history.replaceState(null, '', location.pathname); clearInterval(P.timer); render(); };
    var s = $('#sairP'); if (s) s.onclick = function () { var tk = SESS.token; SESS = null; guardar('corretor_sessao', null); api('sair', tk).catch(function () {}); P.dados = null; render(); };
  }
}
function render() { topo(); if (modo === 'aluno') renderAluno(); else renderProf(); }

/* =================== ALUNO =================== */
function renderAluno() {
  var atual = pegar('prova_atual');
  if (atual && A.tela === 'codigo' && !A.s) return retomar(atual);
  if (A.tela === 'codigo') telaCodigo();
  else if (A.tela === 'nome') telaNome();
  else if (A.tela === 'pin') telaPin();
  else if (A.tela === 'prova') telaProva();
  else if (A.tela === 'fim') telaFim();
}
function telaCodigo() {
  $('#app').innerHTML =
    '<div class="stack" style="max-width:480px;margin:0 auto">' +
    '<div><div class="eyebrow">Para o estudante</div><h1>Digite o código da prova</h1></div>' +
    '<form class="panel stack" id="fCod">' +
    '<input type="text" id="cod" class="codein" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Código da prova" placeholder="······">' +
    '<p class="hint" style="margin:0">O professor mostra o código no quadro. São 6 letras e números.</p>' +
    (A.erro ? '<div class="erro">' + esc(A.erro) + '</div>' : '') +
    '<button class="btn primary" type="submit">Entrar</button></form></div>';
  var c = $('#cod'); c.focus();
  c.oninput = function () { c.value = c.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); };
  $('#fCod').onsubmit = function (ev) {
    ev.preventDefault();
    var v = c.value.trim();
    if (v.length < 6) { A.erro = 'O código tem 6 letras e números.'; return telaCodigo(); }
    chamar('Abrindo a prova...', 'alunoAbrir', v).then(function (p) {
      A.prova = p; A.erro = ''; A.turma = p.turmas.length === 1 ? p.turmas[0] : ''; A.busca = ''; A.tela = 'nome'; render();
    }).catch(function (e) { A.erro = e.message; telaCodigo(); $('#cod').value = v; });
  };
}
function telaNome() {
  var p = A.prova;
  var lista = p.estudantes.filter(function (e) { return (!A.turma || e.turma === A.turma) && (!A.busca || e.nome.toLowerCase().indexOf(A.busca.toLowerCase()) >= 0); });
  $('#app').innerHTML =
    '<div class="stack">' +
    '<div><div class="eyebrow">' + esc(p.tipo) + ' · ' + p.questoes + ' questões · ' + p.duracao + ' minutos</div><h1>' + esc(p.nome) + '</h1></div>' +
    '<section class="panel stack">' +
    (p.turmas.length > 1 ? '<div><div class="eyebrow" style="margin-bottom:8px">1. Sua turma</div><div class="chips">' +
      p.turmas.map(function (t) { return '<button class="chip" data-t="' + esc(t) + '" aria-pressed="' + (A.turma === t) + '">' + esc(t) + '</button>'; }).join('') + '</div></div>' : '<div class="eyebrow">Turma ' + esc(p.turmas[0]) + '</div>') +
    (A.turma ? '<div class="stack"><div class="eyebrow">' + (p.turmas.length > 1 ? '2. ' : '') + 'Toque no seu nome</div>' +
      '<input type="text" id="busca" placeholder="Procurar nome" value="' + esc(A.busca) + '" autocomplete="off">' +
      '<div class="names">' + (lista.length ? lista.map(function (e) { return '<button class="name" data-e="' + esc(e.id) + '">' + esc(e.nome) + '</button>'; }).join('') : '<p class="hint">Nenhum nome encontrado. Fale com o professor.</p>') + '</div></div>' : '') +
    (A.erro ? '<div class="erro">' + esc(A.erro) + '</div>' : '') +
    '</section><div><button class="btn ghost" id="voltar">← Outro código</button></div></div>';
  document.querySelectorAll('[data-t]').forEach(function (b) { b.onclick = function () { A.turma = b.dataset.t; A.busca = ''; telaNome(); }; });
  var bu = $('#busca'); if (bu) bu.oninput = function () { A.busca = bu.value; var pos = bu.selectionStart; telaNome(); var n = $('#busca'); n.focus(); n.setSelectionRange(pos, pos); };
  $('#voltar').onclick = function () { A.tela = 'codigo'; A.prova = null; A.erro = ''; render(); };
  document.querySelectorAll('[data-e]').forEach(function (b) {
    b.onclick = function () {
      var e = p.estudantes.filter(function (x) { return x.id === b.dataset.e; })[0];
      A.est = e; A.erro = ''; A.tela = 'pin'; render();
    };
  });
}
function telaPin() {
  var p = A.prova, e = A.est;
  $('#app').innerHTML =
    '<form class="stack" id="fPin" style="max-width:480px;margin:0 auto">' +
    '<div><div class="eyebrow">Turma ' + esc(e.turma) + '</div><h1>' + esc(e.nome) + '</h1></div>' +
    '<section class="panel stack">' +
    '<label for="pin">Digite o seu PIN (6 números do seu cartão)</label>' +
    '<input type="password" id="pin" class="codein" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" placeholder="······">' +
    '<p class="hint" style="margin:0">Ao tocar em Começar, o tempo de ' + p.duracao + ' minutos começa a contar. Você precisa responder todas as questões para entregar.</p>' +
    (A.erro ? '<div class="erro">' + esc(A.erro) + '</div>' : '') +

    '<section class="panel stack">' + e.questoes.map(function (q, i) {
      return '<div class="q-edit"><div class="row spread"><strong>Questão ' + (i + 1) + '</strong>' + (e.questoes.length > 1 ? '<button class="btn small danger" data-del="' + i + '">Remover</button>' : '') + '</div>' +
        '<label>Enunciado<textarea id="en-' + i + '" data-en="' + i + '">' + esc(q.enunciado) + '</textarea></label>' +
        '<span class="hint">Toque na letra para marcar a alternativa correta.</span>' +
        q.alts.slice(0, na).map(function (a, k) {
          return '<div class="alt-edit"><label class="key' + (q.certa === k ? ' on' : '') + '" title="Marcar ' + L[k] + ' como correta"><input type="radio" name="c-' + i + '" data-certa="' + i + '" value="' + k + '"' + (q.certa === k ? ' checked' : '') + '>' + L[k] + '</label>' +
            '<input type="text" id="a-' + i + '-' + k + '" data-alt="' + i + '" data-k="' + k + '" value="' + esc(a) + '" aria-label="Alternativa ' + L[k] + ' da questão ' + (i + 1) + '"></div>';
        }).join('') + '</div>';
    }).join('') + '<button class="btn" id="addQ">+ Nova questão</button></section>' +
    (P.erro ? '<div class="erro">' + esc(P.erro) + '</div>' : '') +
    '<div class="row" style="justify-content:flex-end"><button class="btn ghost" id="cancelar2">Cancelar</button><button class="btn primary" id="salvar">Salvar prova</button></div></div>';
  function lerCampos() {
    e.nome = $('#eNome').value; e.tipo = $('#eTipo').value; e.duracao = $('#eDur').value; e.valor = $('#eVal').value;
    e.embaralhar = $('#eEmb').checked; e.mostrarNota = $('#eMos').checked;
  }
  ['#eNome', '#eTipo', '#eDur', '#eVal', '#eEmb', '#eMos'].forEach(function (s) { $(s).onchange = lerCampos; $(s).oninput = lerCampos; });
  $('#eAlt').onchange = function () { lerCampos(); e.alternativas = +$('#eAlt').value; e.questoes.forEach(function (q) { if (q.certa >= e.alternativas) q.certa = -1; }); telaEditor(); };
  document.querySelectorAll('[data-turma]').forEach(function (b) { b.onclick = function () { lerCampos(); var t = b.dataset.turma, k = e.turmas.indexOf(t); if (k >= 0) e.turmas.splice(k, 1); else e.turmas.push(t); telaEditor(); }; });
  document.querySelectorAll('[data-en]').forEach(function (t) { t.oninput = function () { e.questoes[+t.dataset.en].enunciado = t.value; }; });
  document.querySelectorAll('[data-alt]').forEach(function (t) { t.oninput = function () { e.questoes[+t.dataset.alt].alts[+t.dataset.k] = t.value; }; });
  document.querySelectorAll('[data-certa]').forEach(function (r) { r.onchange = function () { lerCampos(); e.questoes[+r.dataset.certa].certa = +r.value; telaEditor(); }; });
  document.querySelectorAll('[data-del]').forEach(function (b) { b.onclick = function () { lerCampos(); e.questoes.splice(+b.dataset.del, 1); telaEditor(); }; });
  $('#addQ').onclick = function () { lerCampos(); e.questoes.push({ enunciado: '', alts: ['', '', '', '', ''], certa: -1 }); telaEditor(); var el = $('#en-' + (e.questoes.length - 1)); if (el) el.focus(); };
  function cancelar() { P.tela = 'lista'; P.ed = null; P.erro = ''; render(); }
  $('#cancelar').onclick = cancelar; $('#cancelar2').onclick = cancelar;
  $('#salvar').onclick = function () {
    lerCampos();
    var envio = { id: e.id, nome: e.nome, tipo: e.tipo, turmas: e.turmas, duracao: e.duracao, valor: e.valor, alternativas: e.alternativas, embaralhar: e.embaralhar, mostrarNota: e.mostrarNota, questoes: e.questoes };
    chamar('Salvando a prova...', 'onlineSalvar', envio).then(function (r) {
      P.dados = r; P.tela = 'lista'; P.ed = null; P.erro = ''; render(); window.scrollTo(0, 0);
    }).catch(function (err) { P.erro = err.message; telaEditor(); var x = document.querySelector('.erro'); if (x) x.scrollIntoView({ block: 'center' }); });
  };
}

// ----- PINs dos estudantes -----
function carregarPins(turma) {
  return chamar('Carregando PINs...', 'onlinePins', turma || '').then(function (r) { P.pins = r; telaPins(); })
    .catch(function (e) { modal('Não deu certo', e.message, [['OK', fecharModal, 'primary']]); });
}
function telaPins() {
  var d = P.pins;
  if (!d) { $('#app').innerHTML = '<p class="hint">Carregando...</p>'; carregarPins(P.pinsTurma || ''); return; }
  var lista = d.estudantes.filter(function (e) { return !P.pinsBusca || e.nome.toLowerCase().indexOf(P.pinsBusca.toLowerCase()) >= 0; });
  $('#app').innerHTML = '<div class="stack">' +
    '<div class="row spread noprint"><div><div class="eyebrow">Área do professor</div><h1>PINs dos estudantes</h1></div><button class="btn ghost" id="voltarP">← Provas</button></div>' +
    '<section class="panel stack noprint">' +
    '<p style="margin:0">Cada estudante tem um PIN de 6 números que vale para todas as provas online. Imprima os cartões da turma, recorte e entregue a cada um. Se alguém esquecer, o PIN está aqui. Se alguém descobrir o PIN de um colega, gere um novo.</p>' +
    '<div class="chips"><button class="chip" data-pt="" aria-pressed="' + (!d.turma) + '">Todas</button>' + d.turmas.map(function (t) { return '<button class="chip" data-pt="' + esc(t.turma) + '" aria-pressed="' + (d.turma === t.turma) + '">' + esc(t.turma) + '</button>'; }).join('') + '</div>' +
    '<div class="row spread"><input type="text" id="pBusca" placeholder="Procurar nome" value="' + esc(P.pinsBusca || '') + '" style="max-width:320px" autocomplete="off">' +
    '<button class="btn primary" id="imprimir">Imprimir cartões (' + lista.length + ')</button></div>' +
    '<p class="hint" style="margin:0">Na janela de impressão, escolha a impressora ou "Salvar como PDF". Cabem 18 cartões por folha A4.</p>' +
    '<div class="table-wrap"><table><thead><tr><th>Estudante</th><th>Turma</th><th>PIN</th><th></th></tr></thead><tbody>' +
    lista.map(function (e) {
      return '<tr><td>' + esc(e.nome) + '</td><td>' + esc(e.turma) + '</td><td><span class="code" style="font-size:18px">' + esc(e.pin) + '</span></td>' +
        '<td><button class="btn small" data-np="' + esc(e.id) + '">Gerar novo PIN</button></td></tr>';
    }).join('') + '</tbody></table></div></section>' +
    '<div class="cartoes">' + lista.map(function (e) {
      return '<div class="cartao"><div class="ct-top">EMFAL · Prova Online</div><div class="ct-nome">' + esc(e.nome) + '</div><div class="ct-turma">Turma ' + esc(e.turma) + '</div>' +
        '<div class="ct-pin">' + esc(e.pin) + '</div><div class="ct-obs">Este é o seu PIN. Guarde o cartão e não mostre a ninguém.</div></div>';
    }).join('') + '</div></div>';
  $('#voltarP').onclick = function () { P.tela = 'lista'; render(); };
  document.querySelectorAll('[data-pt]').forEach(function (b) { b.onclick = function () { P.pinsTurma = b.dataset.pt; P.pinsBusca = ''; carregarPins(b.dataset.pt); }; });
  var bu = $('#pBusca'); bu.oninput = function () { P.pinsBusca = bu.value; var pos = bu.selectionStart; telaPins(); var n = $('#pBusca'); n.focus(); n.setSelectionRange(pos, pos); };
  $('#imprimir').onclick = function () { window.print(); };
  document.querySelectorAll('[data-np]').forEach(function (b) {
    b.onclick = function () {
      var e = d.estudantes.filter(function (x) { return x.id === b.dataset.np; })[0];
      modal('Gerar novo PIN para ' + e.nome + '?', 'O PIN atual (' + e.pin + ') deixa de funcionar. Entregue um cartão novo ao estudante.', [['Cancelar', fecharModal, 'ghost'], ['Gerar novo PIN', function () {
        fecharModal();
        chamar('Gerando PIN...', 'onlineNovoPin', e.id).then(function () { return carregarPins(P.pinsTurma || ''); }).then(function () { aviso('Novo PIN de ' + e.nome + ' criado.'); })
          .catch(function (err) { modal('Não deu certo', err.message, [['OK', fecharModal, 'primary']]); });
      }, 'primary']]);
    };
  });
}
function aviso(msg) { var a = document.createElement('div'); a.className = 'toast'; a.setAttribute('role', 'status'); a.textContent = msg; document.body.appendChild(a); setTimeout(function () { a.remove(); }, 3500); }

// ----- acompanhamento -----
var SIT = { NAO_INICIOU: ['Não começou', 'mute'], FAZENDO: ['Fazendo', 'pen'], ENTREGUE: ['Entregou', 'ok'], ABANDONOU: ['Não entregou', 'bad'] };
function abrirAcomp(id) {
  P.acompId = id; P.tela = 'acomp'; P.acomp = null; render();
  clearInterval(P.timer); P.timer = setInterval(function () { if (modo === 'prof' && P.tela === 'acomp' && !document.hidden) atualizarAcomp(true); }, 20000);
}
function atualizarAcomp(silencioso) {
  var pr = silencioso ? api('onlineAcompanhar', P.acompId) : chamar('Atualizando...', 'onlineAcompanhar', P.acompId);
  return pr.then(function (r) { P.acomp = r; if (P.tela === 'acomp') telaAcomp(); }).catch(function (e) { if (!silencioso) modal('Não deu certo', e.message, [['OK', fecharModal, 'primary']]); });
}
function agruparOcs(lista) {
  var out = [], idx = {};
  lista.forEach(function (o) { var k = o.estudante + '|' + o.tipo; if (idx[k] === undefined) { idx[k] = out.length; out.push(Object.assign({ n: 1 }, o)); } else out[idx[k]].n++; });
  return out;
}
function telaAcomp() {
  var a = P.acomp;
  if (!a) { $('#app').innerHTML = '<p class="hint">Carregando...</p>'; atualizarAcomp(false); return; }
  var c = { NAO_INICIOU: 0, FAZENDO: 0, ENTREGUE: 0, ABANDONOU: 0 };
  a.estudantes.forEach(function (e) { c[e.situacao]++; });
  var ent = a.estudantes.filter(function (e) { return e.nota !== null; }), media = ent.length ? ent.reduce(function (s, e) { return s + Number(e.nota); }, 0) / ent.length : null;
  var ordem = { FAZENDO: 0, ABANDONOU: 1, ENTREGUE: 2, NAO_INICIOU: 3 };
  var lista = a.estudantes.slice().sort(function (x, y) { return ((y.alertas || []).length ? 1 : 0) - ((x.alertas || []).length ? 1 : 0) || (ordem[x.situacao] - ordem[y.situacao]) || x.turma.localeCompare(y.turma) || x.nome.localeCompare(y.nome, 'pt-BR'); });
  $('#app').innerHTML = '<div class="stack">' +
    '<div class="row spread"><div><div class="eyebrow">Acompanhar · código <span class="code">' + esc(a.prova.codigo) + '</span></div><h1>' + esc(a.prova.nome) + '</h1></div><button class="btn ghost" id="voltarL">← Provas</button></div>' +
    '<section class="panel stack"><div class="tot">' +
    '<span class="pill pen">' + c.FAZENDO + ' fazendo</span><span class="pill ok">' + c.ENTREGUE + ' entregaram</span>' +
    (c.ABANDONOU ? '<span class="pill bad">' + c.ABANDONOU + ' não entregaram</span>' : '') + '<span class="pill mute">' + c.NAO_INICIOU + ' não começaram</span>' +
    (media !== null ? '<span class="pill ok">Média ' + num(media) + ' de ' + num(a.prova.valor) + '</span>' : '') + '</div>' +
    ((a.ocorrencias || []).length ? '<div class="notice bad stack" style="gap:6px"><strong>Alertas desta prova (' + a.ocorrencias.length + ')</strong><div class="ocs">' + agruparOcs(a.ocorrencias).slice(0, 8).map(function (o) { return '<div><span>' + esc(o.quando.slice(-5)) + '</span><strong>' + esc(o.estudante) + '</strong><span>' + esc(o.tipo) + (o.n > 1 ? ' (' + o.n + 'x)' : '') + '</span>' + (o.aparelho ? '<span class="hint">' + esc(o.aparelho) + '</span>' : '') + '</div>'; }).join('') + '</div></div>' : '') +
    '<div class="row spread"><span class="hint">Atualiza sozinho a cada 20 segundos. ' + (a.prova.ativa ? 'A prova está aberta.' : 'A prova está fechada: os alunos não conseguem começar.') + '</span><button class="btn small" id="atual">Atualizar agora</button></div>' +
    '<div class="table-wrap"><table><thead><tr><th>Estudante</th><th>Turma</th><th>Situação</th><th>Nota</th><th>Acertos</th><th>Saiu da tela</th><th>Alertas</th><th></th></tr></thead><tbody>' +
    lista.map(function (e) {
      var s = SIT[e.situacao] || ['?', 'mute'];
      var extra = e.situacao === 'FAZENDO' && e.resta !== null ? ' · ' + fmt(e.resta) : '';
      return '<tr><td>' + esc(e.nome) + '</td><td>' + esc(e.turma) + '</td><td><span class="pill ' + s[1] + '">' + s[0] + extra + '</span>' + (e.obs ? '<div class="hint">' + esc(e.obs) + '</div>' : '') + '</td>' +
        '<td>' + (e.nota !== null ? num(e.nota) : '—') + '</td><td>' + (e.acertos !== null ? e.acertos + '/' + a.prova.questoes : '—') + '</td>' +
        '<td>' + (e.saidas ? '<span class="pill bad">' + e.saidas + '×</span>' : (e.situacao === 'NAO_INICIOU' ? '—' : '<span class="pill ok">0</span>')) + '</td>' +
        '<td style="white-space:normal;min-width:180px">' + (e.alertas || []).map(function (x) { return '<span class="pill bad" style="margin:0 4px 4px 0;white-space:normal">' + esc(x) + '</span>'; }).join('') + (e.aparelho ? '<div class="hint">' + esc(e.aparelho) + '</div>' : '') + '</td>' +
        '<td>' + (e.situacao !== 'NAO_INICIOU' ? '<button class="btn small" data-lib="' + esc(e.id) + '">Liberar</button>' : '') + '</td></tr>';
    }).join('') + '</tbody></table></div></section>' +
    '<p class="hint">"Liberar" apaga o início da prova desse estudante para ele poder começar outra vez (por exemplo, se o tablet descarregou). A nota anterior é substituída quando ele entregar de novo.</p></div>';
  $('#voltarL').onclick = function () { clearInterval(P.timer); P.tela = 'lista'; P.dados = null; render(); };
  $('#atual').onclick = function () { atualizarAcomp(false); };
  document.querySelectorAll('[data-lib]').forEach(function (b) {
    b.onclick = function () {
      var e = a.estudantes.filter(function (x) { return x.id === b.dataset.lib; })[0];
      modal('Liberar ' + e.nome + ' de novo?', 'O tempo recomeça do zero quando ele entrar outra vez.', [['Cancelar', fecharModal, 'ghost'], ['Liberar', function () { fecharModal(); chamar('Liberando...', 'onlineLiberar', P.acompId, e.id).then(function (r) { P.acomp = r; telaAcomp(); }).catch(function (err) { modal('Não deu certo', err.message, [['OK', fecharModal, 'primary']]); }); }, 'primary']]);
    };
  });
}

window.addEventListener('hashchange', function () { if (location.hash === '#professor' && modo !== 'prof') { modo = 'prof'; render(); } });
render();
</script>
</body></html>
